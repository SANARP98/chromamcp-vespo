appId: com.vespo.desktop
productName: Vespo
directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - node_modules/**/*
  - package.json

extraResources:
  - from: "build"
    to: "build"
    filter:
      - "icon.png"
  - from: "../mcp/vespo-patched"
    to: "mcp"
    filter:
      - "**/*"
      - "!node_modules/.cache"
      - "!**/*.test.js"

win:
  target: nsis
  icon: build/icon.ico
  signAndEditExecutable: false

mac:
  target:
    - dmg
    - zip
  icon: build/icon.icns
  category: public.app-category.developer-tools

linux:
  target: AppImage
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
  include: build/installer.nsh
