name: Build and Push Multi-Platform Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/chromamcp-vespo

jobs:
  # ── Build each platform separately with platform-specific tags ──
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from package.json
        id: pkg
        run: |
          VERSION=$(jq -r '.version' mcp/vespo-patched/package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image
        uses: docker/build-push-action@v6
        with:
          context: ./mcp/vespo-patched
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.pkg.outputs.version }}-${{ matrix.suffix }}
            ${{ env.IMAGE }}:latest-${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,scope=${{ matrix.suffix }},mode=max
          provenance: false

  # ── Merge into multi-arch manifests ──
  manifest:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: pkg
        run: |
          VERSION=$(jq -r '.version' mcp/vespo-patched/package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest (version)
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}:${{ steps.pkg.outputs.version }} \
            ${{ env.IMAGE }}:${{ steps.pkg.outputs.version }}-amd64 \
            ${{ env.IMAGE }}:${{ steps.pkg.outputs.version }}-arm64

      - name: Create multi-arch manifest (latest)
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:latest-amd64 \
            ${{ env.IMAGE }}:latest-arm64

      - name: Summary
        run: |
          echo "## Docker Images Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Multi-arch tags (auto-selects correct platform)" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ env.IMAGE }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ env.IMAGE }}:${{ steps.pkg.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Platform-specific tags" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "# Intel/AMD (Linux, Windows, Mac Intel)" >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ env.IMAGE }}:${{ steps.pkg.outputs.version }}-amd64" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "# ARM (Mac M1/M2/M3, ARM Linux)" >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ env.IMAGE }}:${{ steps.pkg.outputs.version }}-arm64" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
